<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Dunkler Hintergrund für Kontrast -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E" />
      <stop offset="100%" stop-color="#16213E" />
    </linearGradient>
    <!-- Obsidian/Export Lila Gradient für die Chatblase -->
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A00E0" />
      <stop offset="100%" stop-color="#8E2DE2" />
    </linearGradient>
    <!-- Gemini-Style Sparkle Gradient (Cyan/Grün) -->
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
  </defs>

  <!-- Basis Hintergrund mit abgerundeten Ecken (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#2F2F4F" stroke-width="2"/>

  <!-- Chat-Blase -->
  <path d="M30 40 C30 30, 38 22, 48 22 L80 22 C90 22, 98 30, 98 40 L98 72 C98 82, 90 90, 80 90 L56 90 L34 104 C30 107, 26 104, 28 98 L30 88 C30 84, 30 78, 30 72 Z"
        fill="url(#accent)" fill-opacity="0.9"/>

  <!-- Fetter Export/Download Pfeil in der Mitte -->
  <path d="M64 40 L64 72 M48 56 L64 72 L80 56"
        stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- KI Stern / Sparkle (Top Right) -->
  <path d="M96 16 C96 26, 104 34, 114 34 C104 34, 96 42, 96 52 C96 42, 88 34, 78 34 C88 34, 96 26, 96 16 Z"
        fill="url(#spark)"/>
</svg>